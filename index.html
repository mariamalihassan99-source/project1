<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Card</title>

     <link rel="stylesheet" href="style.css">
     <script src="app.js" defer></script>
</head>
<body>

    
    
    <main class="game-container"></main>

     <header class="game-header">
<p class="subtitle">
    A LITTLE GAME TO BRIGHTEN YOUR DAY
</p>

    <h1>Memory card Game</h1>

    <p class=" instruction" >
   Find all the matching pairs  ♡
</p>
</header>


<!-- Game Statistics -->

<section class="game-stats">

    <div class = 'stat' > 
        <span class="stat-lebel">Time</span>
         <span id="time">00:00</span>
    </div>

<div class="stat">
      <span class="stat-label">moves</span>
      <span id="moves">0</span>
</div>


<div class="stat">
    <span class="stat-label">Pairs</span>
    <span id="pairs" >0 / 8</span>

</div>

</section>

   <!-- Memory Cards -->

<section
id="game-board"
class="game-board"
aria-label="memory card game board" ></section>

       <!-- Game Message -->

       <p id="message" class="message" aria-live="polite">
        Ready to play? ♡
       </p>
     <!-- Restart Button -->

      <button id="restart-button" class="restart-button" type="button">
            ♡ Restart Game ♡
        </button>

</main>
 
</body>
</html>
